<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 512" role="img" aria-labelledby="title desc">
  <title id="title">SawDust logo v2</title>
  <desc id="desc">A dark green rounded square with an oak board whose lower edge is saw teeth; wood grain with a knot; sawdust falling below the cut. The word SawDust in slab serif at right with the tagline Design, Plan, Build.</desc>
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F4C77F"/>
      <stop offset="1" stop-color="#C97732"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#18332C"/>
  <!-- board with saw-tooth lower edge -->
  <path d="M113 146Q113 113 146 113H336Q369 113 369 146V293L342 333L315 293L288 333L261 293L234 333L207 293L180 333L153 293L113 333Z" fill="url(#wood)"/>
  <!-- grain: three arcs, one direction only -->
  <path d="M155 180C195 142 284 144 329 184M151 225C198 190 286 192 333 229M151 266C193 235 274 237 318 269" fill="none" stroke="#9B5627" stroke-width="13" stroke-linecap="round" opacity=".75"/>
  <!-- knot between the upper grain lines -->
  <ellipse cx="240" cy="176" rx="16" ry="11" fill="#7A4420" opacity=".85"/>
  <ellipse cx="240" cy="176" rx="25" ry="17" fill="none" stroke="#9B5627" stroke-width="5" opacity=".5"/>
  <!-- sawdust falling from the cut -->
  <circle cx="330" cy="372" r="12" fill="#F4C77F"/>
  <circle cx="282" cy="390" r="8" fill="#F4C77F"/>
  <circle cx="378" cy="399" r="6" fill="#F4C77F"/>
  <circle cx="322" cy="428" r="4" fill="#F4C77F"/>
  <circle cx="240" cy="408" r="5" fill="#F4C77F" opacity=".85"/>
  <!-- wordmark: slab serif; textLength pins layout even if font fallback differs -->
  <text x="560" y="306" font-family="Rockwell, 'Roboto Slab', Georgia, serif" font-size="176" font-weight="700" textLength="790" lengthAdjust="spacingAndGlyphs" fill="#18332C">Saw<tspan fill="#C97732">Dust</tspan></text>
  <rect x="560" y="346" width="790" height="10" rx="5" fill="#F4C77F"/>
  <text x="563" y="410" font-family="Rockwell, 'Roboto Slab', Georgia, serif" font-size="38" font-weight="600" letter-spacing="8" fill="#557068">DESIGN • PLAN • BUILD</text>
</svg>

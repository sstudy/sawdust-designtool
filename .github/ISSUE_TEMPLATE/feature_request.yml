name: Feature request
description: Something you wish SawDust could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The woodworking task or design step, in your own words. This matters more than the feature itself.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like SawDust to do?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A workaround inside SawDust, another tool, pencil and paper.
